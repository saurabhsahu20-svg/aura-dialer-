name: S Caller Badge Change Verification

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/verify-badges.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK 35
        shell: bash
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, lint and compile APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload verification APK (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: S-Caller-badge-verification
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
