name: S call Android Lint Quality Gate
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-lint.yml
      - app/src/main/**
      - app/build.gradle.kts
  pull_request:
    paths:
      - app/src/main/**
      - app/build.gradle.kts
      - .github/workflows/android-lint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Find Android SDK manager
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDK_MANAGER"
          echo "SDKMANAGER=$SDK_MANAGER" >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Store lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-call-android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
