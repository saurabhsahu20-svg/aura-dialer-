name: S call Android Emulator UI Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-emulator-smoke.yml
      - app/src/androidTest/**
      - app/build.gradle.kts
      - app/src/main/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Linux KVM
        run: |
          if test -e /dev/kvm; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run Android UI smoke tests in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-call-emulator-smoke-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
