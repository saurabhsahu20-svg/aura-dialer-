name: S Caller v1.9.9 Verified In-Place Upgrade APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Require the ORIGINAL installed-app signing identity
        env:
          SIGNING_B64: ${{ secrets.SCALL_SIGNING_STORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SCALL_SIGNING_STORE_PASSWORD }}
          ALIAS: ${{ secrets.SCALL_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SCALL_SIGNING_KEY_PASSWORD }}
          INSTALLED_CERT: ${{ secrets.SCALL_EXISTING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_B64" || -z "$STORE_PASSWORD" || -z "$ALIAS" || -z "$KEY_PASSWORD" || -z "$INSTALLED_CERT" ]]; then
            echo "::error::Cannot create an upgrade APK without the original keystore and installed APK's SHA-256 signing fingerprint. See docs/IN_PLACE_UPDATES.md."
            exit 1
          fi
          EXPECTED="$(printf '%s' "$INSTALLED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid expected signing-certificate SHA-256 fingerprint."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/s-caller-upgrade-keystore.jks"
          printf '%s' "$SIGNING_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "SCALL_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "SCALL_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SCALL_SIGNING_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "SCALL_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "SCALL_EXPECTED_CERT=$EXPECTED" >> "$GITHUB_ENV"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, lint, and signed release APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Verify exact old signing certificate, package, version and APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose "$APK"
          CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$CERT"
          if [[ "$CERT" != "$SCALL_EXPECTED_CERT" ]]; then
            echo "::error::Signing mismatch: upgrade would fail to install over the existing app. Release blocked."
            exit 1
          fi
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.scall.phone'"
          echo "$BADGING" | grep -q "versionCode='37'"
          echo "$BADGING" | grep -q "versionName='1.9.9'"
          mkdir -p release-output
          cp "$APK" release-output/S-Caller-v1.9.9-Verified-Upgrade.apk
          (cd release-output && sha256sum S-Caller-v1.9.9-Verified-Upgrade.apk > SHA256SUMS.txt)
          (cd release-output && sha256sum -c SHA256SUMS.txt)
      - name: Upload verified upgrade APK only
        uses: actions/upload-artifact@v4
        with:
          name: S-Caller-v1.9.9-Same-Signature-Upgrade
          path: release-output/
          retention-days: 14
          if-no-files-found: error
      - name: Remove local keystore
        if: always()
        shell: bash
        run: |
          if [[ -n "${SCALL_SIGNING_STORE_FILE:-}" ]]; then
            rm -f "$SCALL_SIGNING_STORE_FILE"
          fi
