name: Publish S call preview APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-s-call.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S call repository
        uses: actions/checkout@v4

      - name: Fetch successful S call APK from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43687891267 --repo "$GITHUB_REPOSITORY" --name S-call-debug-apk --dir release-output
          test -s release-output/app-debug.apk
          echo "Verified APK downloaded from successful Android build."
          ls -lh release-output/app-debug.apk

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.0-preview"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating APK and release notes."
            gh release upload "$TAG" "release-output/app-debug.apk#S-call-v1.0.0-preview.apk" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file RELEASE_NOTES_v1.0.0.md --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "release-output/app-debug.apk#S-call-v1.0.0-preview.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "S call v1.0.0 — Android Preview" \
              --notes-file RELEASE_NOTES_v1.0.0.md \
              --target "4155708088399b59b8c508aa398f0a3b419710e1" \
              --prerelease
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.0.0-preview --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,assets
