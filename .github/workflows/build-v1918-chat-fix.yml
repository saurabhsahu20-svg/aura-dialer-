name: Build S Caller v1.9.18 APK
on:
  # Legacy v1.9.18 preview: retain manual audit, no automatic rebuild on new pushes.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run tests and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S-Caller-v1.9.18-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish downloadable preview APK
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.9.18-direct-chat-preview >/dev/null 2>&1 || gh release create v1.9.18-direct-chat-preview --title "S Caller v1.9.18 Direct Chat Preview" --notes "WhatsApp, Telegram and SMS chooser preview. Debug-signed test build; not a production release." --prerelease
          cp app/build/outputs/apk/debug/app-debug.apk S-Caller-v1.9.18-Direct-Chat-Preview.apk
          gh release upload v1.9.18-direct-chat-preview S-Caller-v1.9.18-Direct-Chat-Preview.apk --clobber
