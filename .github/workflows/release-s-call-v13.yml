name: Release S call v1.3.0 Smooth Slide Preview
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-s-call-v13.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S call source
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK manager
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          echo "SDKMANAGER=$SDK_MANAGER" >> "$GITHUB_ENV"
      - name: Accept SDK licences
        run: yes | "$SDKMANAGER" --licenses > /dev/null || true
      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run gesture unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build release preview debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and prepare APK
        run: |
          set -euo pipefail
          mkdir -p release-output
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-output/S-call-v1.3.0-preview.apk
          test "$(stat -c %s release-output/S-call-v1.3.0-preview.apk)" -gt 100000
          sha256sum release-output/S-call-v1.3.0-preview.apk
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v1.3.0-preview
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Updating existing preview release"
            gh release upload "$TAG" release-output/S-call-v1.3.0-preview.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file RELEASE_NOTES_v1.3.0.md --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-output/S-call-v1.3.0-preview.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "S call v1.3.0 — Long Slide & Mint-Green Icon Preview" \
              --notes-file RELEASE_NOTES_v1.3.0.md \
              --prerelease
          fi
      - name: Verify public release has APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.3.0-preview --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,assets
