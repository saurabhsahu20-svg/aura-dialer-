name: Publish S Caller v1.9.14 End Call Fix Preview

on:
  push:
    branches:
      - fix/scaller-v1914-reliable-end-call
    paths:
      - .github/workflows/publish-v1914-end-call-preview.yml

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Confirm exact version and end-call fix
        shell: bash
        run: |
          grep -q 'versionCode = 42' app/build.gradle.kts
          grep -q 'versionName = "1.9.14"' app/build.gradle.kts
          grep -q 'fun disconnect()' app/src/main/java/com/scall/phone/telecom/CallBridge.kt
          grep -q 'Ending call' app/src/main/java/com/scall/phone/ui/CallScreen.kt
      - name: Unit tests, lint and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify APK and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          APK=release-output/S-Caller-v1.9.14-End-Call-Fix-Preview.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.scall.phone'"
          echo "$BADGING" | grep -q "versionCode='42'"
          echo "$BADGING" | grep -q "versionName='1.9.14'"
          (cd release-output && sha256sum *.apk > SHA256SUMS.txt)
          (cd release-output && sha256sum -c SHA256SUMS.txt)
      - name: Upload verified GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: S-Caller-v1.9.14-End-Call-Fix-Preview
          path: release-output/
          if-no-files-found: error
      - name: Publish public GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## S Caller v1.9.14 — End Call Fix (Developer Preview)

          - Fixed delayed or unresponsive End Call interactions: progress indicator, safe retry of the SAME call, and manual retry when Telecom still reports it active.
          - Active conversation takes priority over other waiting calls when ending.
          - Keeps live keypad contact lookup, grouped call history, spam/safe labels, profile, and missed-call badge.
          - Android 6, 8 and 15 emulator UI tests, unit tests and lint have passed in CI for this source.

          **Important:** This is a debug-signed, developer-preview APK. It is NOT a production or verified in-place update for apps signed with another certificate. Back up data before any uninstall. Real SIM-call hangup performance has not been tested on a physical phone.
          EOF
          TAG=v1.9.14-end-call-fix-preview
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-output/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file release-notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-output/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "S Caller v1.9.14 — End Call Fix Preview" \
              --notes-file release-notes.md \
              --prerelease
          fi
