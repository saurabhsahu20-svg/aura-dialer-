name: Public S Caller v1.8.8 Smooth Preview Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-s-caller-v188-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Find and prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Require tested release identity
        run: |
          grep -q 'versionCode = 26' app/build.gradle.kts
          grep -q 'versionName = "1.8.8"' app/build.gradle.kts
          test -s RELEASE_NOTES_v1.8.8.md
      - name: Run unit tests and Android lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Build tested preview APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify signing, package and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/S-Caller-v1.8.8-preview.apk
          test -s release-output/S-Caller-v1.8.8-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release-output/S-Caller-v1.8.8-preview.apk
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release-output/S-Caller-v1.8.8-preview.apk)"
          echo "$BADGING" | grep -q "package: name='com.scall.phone'"
          echo "$BADGING" | grep -q "versionCode='26'"
          echo "$BADGING" | grep -q "versionName='1.8.8'"
          (cd release-output && sha256sum S-Caller-v1.8.8-preview.apk > SHA256SUMS.txt)
          (cd release-output && sha256sum -c SHA256SUMS.txt)
      - name: Archive verified installer
        uses: actions/upload-artifact@v4
        with:
          name: S-Caller-v1.8.8-preview-download
          path: release-output/
          retention-days: 21
          if-no-files-found: error
      - name: Publish public GitHub prerelease (never label debug build stable)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v1.8.8-preview
          FILES=(release-output/S-Caller-v1.8.8-preview.apk release-output/SHA256SUMS.txt)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file RELEASE_NOTES_v1.8.8.md --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "S Caller v1.8.8 — Smooth UI Developer Preview" \
              --notes-file RELEASE_NOTES_v1.8.8.md --prerelease
          fi
      - name: Confirm public release assets exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.8.8-preview --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,assets
          NAMES="$(gh release view v1.8.8-preview --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$NAMES" | grep -Fqx 'S-Caller-v1.8.8-preview.apk'
          echo "$NAMES" | grep -Fqx 'SHA256SUMS.txt'
