name: Publish S Caller v1.9.16 WhatsApp Telegram Chat Preview

on:
  push:
    branches:
      - feature/scaller-v1916-whatsapp-telegram-chat
    paths:
      - .github/workflows/publish-v1916-chat-shortcuts-preview.yml

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Confirm version and history pagination
        shell: bash
        run: |
          grep -q 'versionCode = 44' app/build.gradle.kts
          grep -q 'versionName = "1.9.16"' app/build.gradle.kts
          grep -q 'externalChatLink' app/src/main/java/com/scall/phone/ui/ExternalChatLinks.kt
          grep -q 'WhatsApp chat' app/src/main/java/com/scall/phone/ui/SCallApp.kt
          grep -q 'Telegram chat' app/src/main/java/com/scall/phone/ui/SCallApp.kt
      - name: Unit tests, lint and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify APK and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          APK=release-output/S-Caller-v1.9.16-WhatsApp-Telegram-Chat-Preview.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.scall.phone'"
          echo "$BADGING" | grep -q "versionCode='44'"
          echo "$BADGING" | grep -q "versionName='1.9.16'"
          (cd release-output && sha256sum *.apk > SHA256SUMS.txt)
          (cd release-output && sha256sum -c SHA256SUMS.txt)
      - name: Upload verified GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: S-Caller-v1.9.16-WhatsApp-Telegram-Chat-Preview
          path: release-output/
          if-no-files-found: error
      - name: Publish public GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## S Caller v1.9.16 — WhatsApp Telegram Chat (Developer Preview)

          - Adds SMS / WhatsApp / Telegram message chooser for phone contacts, dialpad numbers and recent call actions.
          - Uses official click-to-chat links after explicit user tap. Does not scan or claim that a phone number is registered on either platform.
          - Formats +91 Indian numbers, supports explicit international numbers; invalid or ambiguous numbers are rejected.
          - Preserves call-history counts, Load older, call management, saved profiles, spam labels and End Call fixes.
          - Unit tests verify phone-number formatting, link safety and UI compatibility. Real-device WhatsApp/Telegram handling still needs testing.

          **Important:** This is a debug-signed, developer-preview APK. It is NOT a production or verified in-place update for apps signed with another certificate. Back up data before any uninstall. Real SIM-call hangup performance has not been tested on a physical phone.
          EOF
          TAG=v1.9.16-whatsapp-telegram-chat-preview
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-output/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file release-notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release-output/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "S Caller v1.9.16 — WhatsApp Telegram Chat Preview" \
              --notes-file release-notes.md \
              --prerelease
          fi
