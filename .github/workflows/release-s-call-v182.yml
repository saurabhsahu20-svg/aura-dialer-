name: Release S call v1.8.2 Verified Recording Library

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-s-call-v182.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDK_MANAGER"
          echo "SDKMANAGER=$SDK_MANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configure Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Run Android lint checks
        run: gradle --no-daemon :app:lintDebug

      - name: Enable Android emulator hardware acceleration
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi

      - name: Verify Recording Manager and WAV import on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Build S call Android APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify identity, version, archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output/package
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-output/S-call.apk
          cp release-output/S-call.apk release-output/package/S-call.apk
          cp INSTALL_S_CALL.txt release-output/package/INSTALL_S_CALL.txt
          cp QA_REPORT_v1.8.2.md release-output/package/QA_REPORT_v1.8.2.md
          unzip -t release-output/S-call.apk | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release-output/S-call.apk
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release-output/S-call.apk)"
          echo "$BADGING" | head -n 3
          echo "$BADGING" | grep -q "package: name='com.scall.phone'"
          echo "$BADGING" | grep -q "versionCode='20'"
          echo "$BADGING" | grep -q "versionName='1.8.2'"
          # Prevent accidentally shipping an APK that still rejects older Android.
          echo "$BADGING" | grep -q "sdkVersion:'23'"
          (cd release-output/package && sha256sum S-call.apk > SHA256SUMS.txt)
          cp release-output/package/SHA256SUMS.txt release-output/S-call-SHA256SUMS.txt
          (cd release-output/package && zip -q -9 -r ../S-call-v1.8.2-install-package.zip .)
          unzip -t release-output/S-call-v1.8.2-install-package.zip | tail -n 2
          (cd release-output/package && sha256sum -c SHA256SUMS.txt)
          ls -lh release-output/S-call.apk release-output/S-call-v1.8.2-install-package.zip

      - name: Upload verified files as Action artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S-call-v1.8.2-downloads
          path: |
            release-output/S-call.apk
            release-output/S-call-v1.8.2-install-package.zip
            release-output/S-call-SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish verified GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v1.8.2-preview
          FILES=(release-output/S-call.apk release-output/S-call-v1.8.2-install-package.zip release-output/S-call-SHA256SUMS.txt)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file RELEASE_NOTES_v1.8.2.md --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "S call v1.8.2 — Verified Consented Recording Library" \
              --notes-file RELEASE_NOTES_v1.8.2.md \
              --prerelease
          fi

      - name: Verify downloadable APK and ZIP asset names
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.8.2-preview --repo "$GITHUB_REPOSITORY" --json assets,url,isPrerelease
          ASSETS="$(gh release view v1.8.2-preview --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$ASSETS" | grep -Fqx 'S-call.apk'
          echo "$ASSETS" | grep -Fqx 'S-call-v1.8.2-install-package.zip'
          echo "$ASSETS" | grep -Fqx 'S-call-SHA256SUMS.txt'
