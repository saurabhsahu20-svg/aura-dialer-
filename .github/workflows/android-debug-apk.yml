name: Build S call debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK manager
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          echo "SDKMANAGER=$SDK_MANAGER" >> "$GITHUB_ENV"
      - name: Accept SDK licenses
        run: yes | "$SDKMANAGER" --licenses > /dev/null || true
      - name: Install Android platform and build-tools
        run: |
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify swipe accuracy unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S-call-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Publish current-version preview APK
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          TAG="v${VERSION}-preview"
          APK="S-Caller-v${VERSION}-Preview.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > SHA256SUMS.txt
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "S Caller v${VERSION} - CI Preview" --notes "CI-built debug-signed Android APK. Real-device telephony and signing compatibility tests are still required." --prerelease
          gh release upload "$TAG" "$APK" SHA256SUMS.txt --clobber
