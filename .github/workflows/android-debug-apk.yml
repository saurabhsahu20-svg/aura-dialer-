name: Build S call debug APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK manager
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          echo "SDKMANAGER=$SDK_MANAGER" >> "$GITHUB_ENV"
      - name: Accept SDK licenses
        run: yes | "$SDKMANAGER" --licenses > /dev/null || true
      - name: Install Android platform and build-tools
        run: |
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify swipe accuracy unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S-call-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Publish S Caller v1.9.24 GitHub prerelease
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk S-Caller-v1.9.24-Keypad-Viewport-Responsive-Fix.apk
          sha256sum S-Caller-v1.9.24-Keypad-Viewport-Responsive-Fix.apk > SHA256SUMS.txt
          gh release view v1.9.24-keypad-viewport-responsive-preview >/dev/null 2>&1 || gh release create v1.9.24-keypad-viewport-responsive-preview --target "$GITHUB_SHA" --title "S Caller v1.9.24 - Keypad Viewport and Stability Fix" --notes "Preview debug-signed Android build. Preserve all existing S Caller features. Fix parent Column's unbounded keypad height and viewport row-gap sizing; verify using emulator tests, plus contact accuracy and search optimizations. CI unit tests run; real cellular hangup must still be tested on-device. Signing may differ from previous preview APKs; back up app data before uninstalling an earlier build." --prerelease
          gh release upload v1.9.24-keypad-viewport-responsive-preview S-Caller-v1.9.24-Keypad-Viewport-Responsive-Fix.apk SHA256SUMS.txt --clobber
