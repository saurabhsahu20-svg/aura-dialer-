name: S Caller real Telecom crash reproduction (emulator)
on:
  push:
    branches: [fix/scall-crash-reproduction-nov16]
    paths:
      - app/src/main/**
      - .github/workflows/scall-telecom-crash-repro.yml
      - app/build.gradle.kts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-telecom-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Simulated call exercise with crash logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -u
            mkdir -p artifacts
            gradle --no-daemon :app:assembleDebug || exit 1
            adb install -r app/build/outputs/apk/debug/app-debug.apk || exit 1
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb shell cmd role add-role-holder android.app.role.DIALER com.scall.phone > artifacts/role.txt 2>&1 || true
            adb shell cmd role holders android.app.role.DIALER >> artifacts/role.txt 2>&1 || true
            for p in CALL_PHONE READ_PHONE_STATE READ_CONTACTS READ_CALL_LOG POST_NOTIFICATIONS; do
              adb shell pm grant com.scall.phone "android.permission.$p" >> artifacts/role.txt 2>&1 || true
            done
            adb logcat -c || true
            adb shell am start -W -n com.scall.phone/.MainActivity > artifacts/launch.txt 2>&1 || true
            sleep 4
            adb shell am start -W -a android.intent.action.CALL -d tel:5550102 > artifacts/outgoing.txt 2>&1 || true
            sleep 6
            adb shell dumpsys activity activities > artifacts/activities.txt 2>&1 || true
            adb emu gsm call 5550103 > artifacts/incoming.txt 2>&1 || true
            sleep 6
            adb shell input keyevent KEYCODE_CALL || true
            sleep 3
            adb emu gsm cancel 5550103 >> artifacts/incoming.txt 2>&1 || true
            sleep 3
            adb logcat -d -b crash -v threadtime > artifacts/crash-logcat.txt 2>&1 || true
            adb logcat -d -v threadtime -t 5000 > artifacts/telecom-logcat.txt 2>&1 || true
            adb shell dumpsys telecom > artifacts/dumpsys-telecom.txt 2>&1 || true
            if grep -qE 'Process: com\.scall\.phone|FATAL EXCEPTION.*com\.scall\.phone' artifacts/crash-logcat.txt; then
              echo 'CRASH REPRODUCED in S Caller'
              grep -A 35 -B 3 'Process: com.scall.phone' artifacts/crash-logcat.txt || true
              exit 1
            fi
            echo 'No S Caller FATAL EXCEPTION in simulated call exercise'
      - name: Save test evidence even on crashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-caller-telecom-crash-repro-logs
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
